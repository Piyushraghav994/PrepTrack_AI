spring.application.name=PrepTrack
# ============================================================
#  SERVER PORT
#  Locally: always 8080.
#  On Render: Render injects PORT automatically; ${PORT:8080}
#  means "use the PORT env var, or fall back to 8080".
# ============================================================
server.port=${PORT:8080}

# ============================================================
#  MySQL DataSource
#
#  LOCAL DEVELOPMENT  →  values below are used automatically
#    because the env vars DB_URL / DB_USERNAME / DB_PASSWORD
#    are NOT set on your laptop.
#
#  PRODUCTION (Render)  →  set these as Render Environment
#    Variables and the defaults below are ignored.
#
#  ${DB_URL:jdbc:mysql://...}  means:
#    "use DB_URL if set, otherwise use the fallback after :"
# ============================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/preptrack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================
#  JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ============================================================
#  JWT Configuration
#
#  LOCAL DEVELOPMENT  →  the fallback Base64 secret is used.
#  PRODUCTION (Render)  →  set JWT_SECRET as a Render
#    Environment Variable. The fallback is intentionally a
#    weak placeholder so it is obvious if it is not set.
#
#  IMPORTANT: The JWT secret MUST be a Base64-encoded string
#  of at least 256 bits (32 bytes). Generate a strong one with:
#    openssl rand -base64 32
# ============================================================
app.jwt.secret=${JWT_SECRET:UHJlcFRyYWNrU2VjcmV0S2V5Rm9ySlRXVG9rZW5HZW5lcmF0aW9uMjAyNlByZXBUcmFja1BsYXRmb3Jt}
app.jwt.expiration=900000

# ==========================================
#  SpringDoc / Swagger UI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# ==========================================
#  Logging
# ==========================================
logging.level.com.PrepTrack_AI=DEBUG
logging.level.org.springframework.security=INFO

# ============================================================
#  Storage Module Configuration
#  Possible values: s3, cloudinary, minio
# ============================================================
app.storage.provider=s3

# ============================================================
#  AWS S3 Config
#
#  LOCAL DEVELOPMENT  →  fallback placeholder values are used;
#    the app detects them and runs in simulated (safe) mode.
#  PRODUCTION (Render)  →  set real values as Render
#    Environment Variables.
# ============================================================
aws.s3.bucket=${AWS_S3_BUCKET:preptrack-resumes}
aws.s3.region=${AWS_REGION:us-east-1}
aws.accessKey=${AWS_ACCESS_KEY:your-aws-access-key}
aws.secretKey=${AWS_SECRET_KEY:your-aws-secret-key}

# ============================================================
#  Cloudinary Config  (not used unless app.storage.provider=cloudinary)
# ============================================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:your-cloudinary-cloud-name}
cloudinary.api-key=${CLOUDINARY_API_KEY:your-cloudinary-api-key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:your-cloudinary-api-secret}

# ============================================================
#  MinIO Config  (not used unless app.storage.provider=minio)
# ============================================================
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:your-minio-access-key}
minio.secret-key=${MINIO_SECRET_KEY:your-minio-secret-key}
minio.bucket=${MINIO_BUCKET:preptrack-bucket}
