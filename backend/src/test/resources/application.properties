spring.application.name=PrepTrack-Test
server.port=8081

# H2 In-Memory Database for testing
spring.datasource.url=jdbc:h2:mem:preptrack_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# JWT Configuration
app.jwt.secret=UHJlcFRyYWNrU2VjcmV0S2V5Rm9ySlRXVG9rZW5HZW5lcmF0aW9uMjAyNlByZXBUcmFja1BsYXRmb3Jt
app.jwt.expiration=900000

# Disable Spring cache and Redis autoconfiguration in tests
spring.cache.type=none
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.main.allow-bean-definition-overriding=true
management.health.redis.enabled=false
