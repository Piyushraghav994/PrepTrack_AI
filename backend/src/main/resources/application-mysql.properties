# ==========================================
#  MySQL DataSource Configuration
#  Activate with: -Dspring.profiles.active=mysql
# ==========================================
spring.datasource.url=jdbc:mysql://localhost:3306/preptrack_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate MySQL Dialect
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
