spring.application.name=PrepTrack
server.port=8080

# ==========================================
#  Default DataSource: H2 In-Memory
#  To use MySQL instead, run with:
#  --spring.profiles.active=mysql
# ==========================================
spring.datasource.url=jdbc:h2:mem:preptrack_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ==========================================
#  JPA / Hibernate
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ==========================================
#  JWT Configuration
#  Secret must be Base64-encoded, >= 256 bits
#  !! Replace with your own strong secret in production !!
# ==========================================
app.jwt.secret=UHJlcFRyYWNrU2VjcmV0S2V5Rm9ySlRXVG9rZW5HZW5lcmF0aW9uMjAyNlByZXBUcmFja1BsYXRmb3Jt
app.jwt.expiration=900000

# ==========================================
#  SpringDoc / Swagger UI
# ==========================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.try-it-out-enabled=true

# ==========================================
#  Logging
# ==========================================
logging.level.com.PrepTrack_AI=DEBUG
logging.level.org.springframework.security=INFO

# ==========================================
#  Storage Module Configuration
#  Possible values: s3, cloudinary, minio
# ==========================================
app.storage.provider=s3

# AWS S3 Config
aws.s3.bucket=preptrack-resumes
aws.s3.region=us-east-1
aws.accessKey=your-aws-access-key
aws.secretKey=your-aws-secret-key

# Cloudinary Config
cloudinary.cloud-name=your-cloudinary-cloud-name
cloudinary.api-key=your-cloudinary-api-key
cloudinary.api-secret=your-cloudinary-api-secret

# MinIO Config
minio.url=http://localhost:9000
minio.access-key=your-minio-access-key
minio.secret-key=your-minio-secret-key
minio.bucket=preptrack-bucket

# ==========================================
#  Redis Configuration
# ==========================================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ==========================================
#  Spring Boot Actuator Configuration
# ==========================================
management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=always
management.health.redis.enabled=false
